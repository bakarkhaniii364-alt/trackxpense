<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="TrackXpense is a local-first, zero-tracker personal finance manager. Complete control over your expenses and assets with secure sync protocols." />
    <meta name="keywords" content="finance manager, expense tracker, local first, privacy first, asset suite, zero trackers, encrypted sync" />
    <title>TrackXpense | Expense Tracker</title>
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="icon" href="/icon.png?v=3" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
  <body>
    <div id="root" class="safe-area"></div>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any conflicting local dev service workers from previous projects
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let reg of registrations) {
              reg.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
              .then(reg => console.log('SW registered'))
              .catch(err => console.log('SW failed', err));
          });
        }
      }
    </script>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
