<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#030303" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="TrackXpense is a local-first, zero-tracker personal finance manager. Complete control over your expenses and assets with secure sync protocols." />
    <meta name="keywords" content="finance manager, expense tracker, local first, privacy first, asset suite, zero trackers, encrypted sync" />
    <title>Expense Tracker | TrackXpense</title>
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="icon" href="/icon.png?v=3" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Polyfill crypto.randomUUID for non-secure contexts (e.g. mobile devices connecting over LAN HTTP: 192.168.x.x)
      if (typeof window !== 'undefined') {
        if (!window.crypto) {
          window.crypto = {};
        }
        if (!window.crypto.randomUUID) {
          window.crypto.randomUUID = function() {
            if (typeof window.crypto.getRandomValues === 'function') {
              try {
                return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
                  return (c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
                });
              } catch (e) {}
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
              var r = Math.random() * 16 | 0;
              var v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          };
        }
      }
    </script>
</head>
  <body>
    <div id="root" class="safe-area"></div>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any conflicting local dev service workers and caches from previous projects
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let reg of registrations) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(keys => {
              for (let k of keys) {
                if (!k.startsWith('trackxpense')) {
                  caches.delete(k);
                }
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
              .then(reg => console.log('SW registered'))
              .catch(err => console.log('SW failed', err));
          });
        }
      }
    </script>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
